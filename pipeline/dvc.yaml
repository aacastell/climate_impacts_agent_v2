      - manifests/tas_future.json
      - climate_pipeline/process/extract.py
      - climate_pipeline/process/indices.py
      - climate_pipeline/process/run.py
    outs:
      - manifests/extreme_heat_days_manifest.json

  process_maize:
    cmd: python -m climate_pipeline.process.run --field maize --bucket climate-impacts-isimip-raw-148323855774 --manifest-dir manifests --work-dir work --out-dir processed_global
    deps:
      - manifests/lpjml_maize_baseline.json
      - manifests/lpjml_maize_future.json
      - climate_pipeline/fetch/agriculture.py
      - climate_pipeline/process/extract.py
      - climate_pipeline/process/run.py
    outs:
      - manifests/maize_manifest.json

  process_spring_wheat:
