      - climate_pipeline/fetch/manifest.py
      - climate_pipeline/fetch/agriculture.py
    outs:
      - manifests/lpjml_rice_future.json

  # process_global replaced by 8 independent per-field stages plus one dedicated GWL-table stage —
  # each its own CLI invocation, own S3 inputs (downloaded directly, not via this stage graph), own
  # fingerprint skip-check. See climate_pipeline/process/run.py's module docstring for why: real
  # profiling showed the old monolithic process_global didn't fit the account's CodeBuild time cap,
  # and `dvc repro process_global` re-ran the whole upstream fetch graph every time (dvc.lock isn't
  # committed to git). Kept here for local dev convenience only — CI invokes `python -m
  # climate_pipeline.process.run --field ...` (or process.gwl_table) directly, not `dvc repro`.
  #
  # None of the 8 field stages depend on tas_preindustrial/tas_future — no field knows or cares
  # about global warming level (see gwl_table.py and run.py's module docstring). GWL is resolved
  # separately, only at query time.
  process_gwl_year_table:
    cmd: python -m climate_pipeline.process.gwl_table --bucket climate-impacts-isimip-raw-148323855774 --manifest-dir manifests --work-dir work
    deps:
      - manifests/tas_preindustrial.json
      - manifests/tas_future.json
      - climate_pipeline/process/warming_levels.py
      - climate_pipeline/process/gwl_table.py
    outs:
      - manifests/gwl_year_table.json

  process_tas:
    cmd: python -m climate_pipeline.process.run --field tas --bucket climate-impacts-isimip-raw-148323855774 --manifest-dir manifests --work-dir work --out-dir processed_global
    deps:
      - manifests/tas_baseline.json
      - manifests/tas_future.json
      - climate_pipeline/process/extract.py
      - climate_pipeline/process/run.py
    outs:
      - manifests/tas_manifest.json

  process_pr:
    cmd: python -m climate_pipeline.process.run --field pr --bucket climate-impacts-isimip-raw-148323855774 --manifest-dir manifests --work-dir work --out-dir processed_global
    deps:
      - manifests/pr_baseline.json
      - manifests/pr_future.json
      - climate_pipeline/process/extract.py
      - climate_pipeline/process/run.py
    outs:
      - manifests/pr_manifest.json

  process_consecutive_dry_days:
    cmd: python -m climate_pipeline.process.run --field consecutive_dry_days --bucket climate-impacts-isimip-raw-148323855774 --manifest-dir manifests --work-dir work --out-dir processed_global
    deps:
      - manifests/pr_baseline.json
      - manifests/pr_future.json
      - climate_pipeline/process/extract.py
      - climate_pipeline/process/indices.py
      - climate_pipeline/process/run.py
    outs:
      - manifests/consecutive_dry_days_manifest.json

  process_extreme_heat_days:
    cmd: python -m climate_pipeline.process.run --field extreme_heat_days --bucket climate-impacts-isimip-raw-148323855774 --manifest-dir manifests --work-dir work --out-dir processed_global
    deps:
