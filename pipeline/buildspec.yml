version: 0.2

# Manually triggered only (scripts/run-codebuild.sh) — no webhook, no push
# trigger. See ADR-006 Step 7: this pipeline updates on ISIMIP/GGCMI's own
# release cadence, not continuously, so there's nothing to watch for.
#
# Runs exactly one command, passed in as RUN_CMD (CodeBuild
# --environment-variables-override, see scripts/run-codebuild.sh) — a direct
# `python -m climate_pipeline.fetch...` or `python -m climate_pipeline.process...`
# invocation, never `dvc repro`. Each fetch/process stage is a fully
# independent unit: its own real S3 inputs (downloaded directly by a fixed
# key — see fetch/manifest.py's upload_manifest), its own outputs, its own
# skip-check. Nothing here can pull another stage along as a side effect —
# that's the whole point, see climate_pipeline/process/run.py's module
# docstring for why `dvc repro` was dropped from CI entirely (dvc.lock isn't
# committed to git, so it re-executed the entire upstream graph every time).
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - cd pipeline
      - pip install -r requirements.txt
  build:
    commands:
      - eval "$RUN_CMD"
